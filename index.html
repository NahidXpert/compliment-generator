<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliment Generator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Modernized Vibrant Palette */
            --color-canvas-base: #FAFAF9;
            --color-surface: rgba(255, 255, 255, 0.7); /* Translucent for glass effect */
            --color-primary-ink: #1C1917;
            --color-brand-action: #6366F1;
            --color-brand-action-hover: #4F46E5;
            --color-playful-accent: #F43F5E;
            --color-success-state: #10B981;
            --color-border: rgba(255, 255, 255, 0.6);
            --color-text-muted: #57534E;
            
            /* Typography */
            --font-display: 'Outfit', sans-serif;
            --font-ui: 'Inter', sans-serif;
            
            /* Shadows & Radii for visual hierarchy */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            --shadow-lg: 0 10px 25px -5px rgba(99, 102, 241, 0.3), 0 8px 10px -6px rgba(99, 102, 241, 0.3);
            --radius-md: 0.75rem;
            --radius-lg: 1.25rem;
            --radius-full: 9999px;
            
            /* Fluid Transitions */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 300ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 500ms cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-ui);
            color: var(--color-primary-ink);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            
            /* Animated Gradient Background */
            background: linear-gradient(-45deg, #FF9A9E, #FECFEF, #A1C4FD, #C2E9FB, #FCE7F3);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-shapes {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; overflow: hidden; pointer-events: none;
        }
        
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.6;
            animation: float 15s infinite ease-in-out alternate;
        }
        
        .shape-1 { background: var(--color-brand-action); width: 300px; height: 300px; top: 10%; left: 10%; animation-delay: 0s; }
        .shape-2 { background: var(--color-playful-accent); width: 400px; height: 400px; bottom: 20%; right: 5%; animation-delay: -5s; }
        .shape-3 { background: #FBBF24; width: 250px; height: 250px; top: 40%; left: 50%; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        .playing-card {
            background-color: #ffffff;
            border-radius: 1.5rem;
            padding: 3rem 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1), inset 0 0 0 2px rgba(255,255,255,0.5);
            position: relative;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .card-decor {
            position: absolute;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-bounce);
        }

        .decor-top-right {
            top: 1.5rem;
            right: 1.5rem;
        }

        .decor-bottom-left {
            bottom: 1.5rem;
            left: 1.5rem;
        }

        .main-actions-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
            width: 100%;
            margin-top: -0.5rem;
        }

        .primary-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-joke {
            background: linear-gradient(135deg, #F59E0B, #D97706);
            color: white;
            padding: 0.85rem 3rem;
            border-radius: var(--radius-full);
            font-size: 1.25rem;
            box-shadow: var(--shadow-lg);
            border: 2px solid rgba(255,255,255,0.2);
        }

        .btn-joke:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 25px -5px rgba(245, 158, 11, 0.4);
        }

        .btn-joke:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
        }

        .joke-punchline {
            display: inline-block;
            font-weight: 700;
            color: var(--color-brand-action);
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .joke-punchline.hidden {
            opacity: 0;
            transform: translateY(15px);
        }

        h1, h2, h3, h4 {
            font-family: var(--font-display);
            font-weight: 700;
            line-height: 1.2;
        }

        button {
            font-family: var(--font-ui);
            cursor: pointer;
            border: none;
            background: none;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        *:focus-visible {
            outline: 2px solid var(--color-brand-action);
            outline-offset: 2px;
            border-radius: 2px;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            /* Gradient Text */
            background: linear-gradient(90deg, #6366F1, #F43F5E, #8B5CF6);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .header p {
            color: var(--color-primary-ink);
            font-size: 1.1rem;
            font-weight: 500;
            opacity: 0.8;
        }

        .card {
            background-color: var(--color-surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-lg);
            padding: 1.75rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--color-border);
        }

        .filters-group {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            border: none;
        }

        .filter-label {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 1.125rem;
        }

        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .radio-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1.25rem;
            border: 2px solid transparent;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: all var(--transition-bounce);
            background-color: rgba(255, 255, 255, 0.6);
            user-select: none;
            font-size: 0.9rem;
        }

        .radio-group input[type="radio"] {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .radio-group input[type="radio"]:checked + .radio-label {
            background-color: var(--color-brand-action);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.4);
        }

        .radio-group input[type="radio"]:focus-visible + .radio-label {
            outline: 2px solid var(--color-brand-action);
            outline-offset: 2px;
        }

        .display-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .compliment-box {
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            border-radius: var(--radius-md);
            /* Inner gradient for pop */
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.5));
            box-shadow: inset 0 2px 10px rgba(255,255,255,0.8);
            width: 100%;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .compliment-text {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--color-primary-ink);
            line-height: 1.4;
            transition: opacity var(--transition-smooth);
        }

        /* The dynamic bounce animation when a new compliment loads */
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            60% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .compliment-text.new-compliment {
            animation: popIn var(--transition-bounce) forwards;
        }
        
        .compliment-text.loading-state {
            opacity: 0.4;
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-brand-action), var(--color-brand-action-hover));
            color: white;
            padding: 0.85rem 3rem;
            border-radius: var(--radius-full);
            font-size: 1.25rem;
            box-shadow: var(--shadow-lg);
            border: 2px solid rgba(255,255,255,0.2);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
        }

        .actions-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 0.5rem;
        }

        .btn-secondary {
            background-color: rgba(255,255,255,0.8);
            color: var(--color-primary-ink);
            padding: 0.6rem 1.25rem;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .btn-secondary:hover {
            background-color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .history-title {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid rgba(0,0,0,0.05);
        }

        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .history-item {
            font-size: 0.95rem;
            color: var(--color-primary-ink);
            padding: 1rem;
            background-color: rgba(255,255,255,0.6);
            border-radius: var(--radius-md);
            animation: slideIn var(--transition-bounce);
            border-left: 4px solid var(--color-brand-action);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-15px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--color-success-state);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-full);
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            opacity: 0;
            transition: all var(--transition-bounce);
            z-index: 50;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .icon {
            width: 1.25rem;
            height: 1.25rem;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <main class="app-container">

        </header>

        <section class="card" aria-labelledby="controls-title">

            <div class="filters-group">

                    <div class="radio-group" id="tone-group">

                    </div>
                </fieldset>

                <fieldset class="filter-section">

                    <div class="radio-group" id="target-group">
                        <input type="radio" id="target-coworker" name="target" value="coworker" checked>
                        <label for="target-coworker" class="radio-label">Coworker</label>
                        
                        <input type="radio" id="target-partner" name="target" value="partner">
                        <label for="target-partner" class="radio-label">Partner</label>
                        
                        <input type="radio" id="target-me" name="target" value="me">
                        <label for="target-me" class="radio-label">Myself</label>
                    </div>
                </fieldset>

            </div>
        </section>

        <section class="card display-section playing-card" aria-labelledby="display-title">
            <div id="decor-tr" class="card-decor decor-top-right" style="background-color: #A1C4FD;">✨</div>
            
            <h2 id="display-title" class="visually-hidden">Your Compliment or Joke</h2>
            
            <div class="compliment-box" style="background: none; box-shadow: none; border: none; min-height: auto;" aria-live="polite" aria-atomic="true">
                <p id="compliment-output" class="compliment-text">
                    Select your options and hit generate! 🚀
                </p>
            </div>

            <div id="decor-bl" class="card-decor decor-bottom-left" style="background-color: #FCE7F3;">🎲</div>
        </section>

        <div class="main-actions-container">
            <div class="primary-buttons">
                <button id="btn-generate" class="btn-primary" aria-label="Generate a new compliment">
                    Brew Compliment

                <button id="btn-joke" class="btn-joke" aria-label="Generate a random joke">
                    Tell a Joke
                </button>
            </div>

            <div class="actions-group">
                <button id="btn-copy" class="btn-secondary" aria-label="Copy to clipboard">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    Copy
                </button>
                <button id="btn-share" class="btn-secondary" aria-label="Share">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                    Share
                </button>
            </div>
        </div>

        <section class="card history-section" aria-labelledby="history-title">
            <h2 id="history-title" class="history-title">Recent Magic ✨</h2>
            <ul id="history-list" class="history-list">
                <li class="history-item" style="text-align:center; border:none; opacity:0.6; background:none;">No history yet.</li>
            </ul>
        </section>

    </main>

    <div id="toast" class="toast" role="alert" aria-live="assertive">
        Copied to clipboard! 📋
    </div>

        class ComplimentApp {
            constructor() {
                this.state = {
                    tone: 'professional',
                    target: 'coworker',
                    currentCompliment: null,
                    isGenerating: false,
                    history: []
                };

                this.STORAGE_KEY = 'compliment_history_v2';
                this.MAX_HISTORY = 5;

                this.elements = {
                    formGroups: {
                        tone: document.getElementsByName('tone'),
                        target: document.getElementsByName('target')
                    },
                    output: document.getElementById('compliment-output'),
                    btnGenerate: document.getElementById('btn-generate'),
                    btnJoke: document.getElementById('btn-joke'),
                    btnCopy: document.getElementById('btn-copy'),
                    btnShare: document.getElementById('btn-share'),
                    historyList: document.getElementById('history-list'),
                    toast: document.getElementById('toast'),
                    decorTr: document.getElementById('decor-tr'),
                    decorBl: document.getElementById('decor-bl')
                };
                
                this.punchlineTimeout = null;

                this.init();
            }

            init() {
                this.loadHistory();
                this.bindEvents();
                this.renderHistory();
            }

            bindEvents() {
                const updateState = (e) => { this.state[e.target.name] = e.target.value; };
                this.elements.formGroups.tone.forEach(el => el.addEventListener('change', updateState));
                this.elements.formGroups.target.forEach(el => el.addEventListener('change', updateState));

                this.elements.btnGenerate.addEventListener('click', () => this.handleGenerate());
                this.elements.btnJoke.addEventListener('click', () => this.handleGenerateJoke());
                this.elements.btnCopy.addEventListener('click', () => this.handleCopy());
                this.elements.btnShare.addEventListener('click', () => this.handleShare());
                
                if (!navigator.share) this.elements.btnShare.style.display = 'none';
            }

            updateCardDecor() {
                const topEmoji = DECOR_EMOJIS[Math.floor(Math.random() * DECOR_EMOJIS.length)];
                const bottomEmoji = DECOR_EMOJIS[Math.floor(Math.random() * DECOR_EMOJIS.length)];
                const topColor = DECOR_COLORS[Math.floor(Math.random() * DECOR_COLORS.length)];
                const bottomColor = DECOR_COLORS[Math.floor(Math.random() * DECOR_COLORS.length)];

                this.elements.decorTr.style.backgroundColor = topColor;
                this.elements.decorTr.textContent = topEmoji;
                this.elements.decorTr.style.transform = `scale(1.3) rotate(${Math.random() * 30 - 15}deg)`;
                
                this.elements.decorBl.style.backgroundColor = bottomColor;
                this.elements.decorBl.textContent = bottomEmoji;
                this.elements.decorBl.style.transform = `scale(1.3) rotate(${Math.random() * 30 - 15}deg)`;

                setTimeout(() => {
                    this.elements.decorTr.style.transform = 'scale(1) rotate(0deg)';
                    this.elements.decorBl.style.transform = 'scale(1) rotate(0deg)';
                }, 400);
            }

            async fetchCompliment(tone, target) {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        const options = COMPLIMENT_DB[tone][target];
                        const randomIndex = Math.floor(Math.random() * options.length);
                        resolve(options[randomIndex]);
                    }, 400); // Shorter delay for snappier feel
                });
            }

            async handleGenerate() {
                if (this.state.isGenerating) return;
                
                if (this.punchlineTimeout) clearTimeout(this.punchlineTimeout);
                
                this.setLoadingState(true, 'compliment');
                this.updateCardDecor();
                this.elements.output.classList.remove('new-compliment');

                try {
                    const compliment = await this.fetchCompliment(this.state.tone, this.state.target);
                    this.state.currentCompliment = compliment;
                    this.elements.output.innerHTML = compliment;
                    
                    // Force a reflow to restart CSS animation cleanly
                    void this.elements.output.offsetWidth;
                    this.elements.output.classList.add('new-compliment');

                    this.addToHistory(compliment);
                } catch (error) {
                    this.elements.output.textContent = "Oops! Our servers are resting. Please try again. 💤";
                } finally {
                    this.setLoadingState(false, 'compliment');
                }
            }

            async handleGenerateJoke() {
                if (this.state.isGenerating) return;
                
                if (this.punchlineTimeout) clearTimeout(this.punchlineTimeout);

                this.setLoadingState(true, 'joke');
                this.updateCardDecor();
                this.elements.output.classList.remove('new-compliment');

                // Simulate fetch delay
                await new Promise(resolve => setTimeout(resolve, 400));

                const joke = JOKES_DB[Math.floor(Math.random() * JOKES_DB.length)];
                this.state.currentCompliment = `${joke.s} ${joke.p}`;
                
                this.elements.output.innerHTML = `
                    <span class="joke-setup">${joke.s}</span>
                    <br><br>
                    <span class="joke-punchline hidden" id="punchline-text">${joke.p}</span>
                `;
                
                void this.elements.output.offsetWidth;
                this.elements.output.classList.add('new-compliment');
                
                this.addToHistory(this.state.currentCompliment);
                this.setLoadingState(false, 'joke');

                // Delay the punchline reveal by 2.5 seconds for dramatic effect
                this.punchlineTimeout = setTimeout(() => {
                    const punchline = document.getElementById('punchline-text');
                    if(punchline) {
                        punchline.classList.remove('hidden');
                    }
                }, 2500);
            }

            setLoadingState(isLoading, type = 'compliment') {
                this.state.isGenerating = isLoading;
                this.elements.btnGenerate.disabled = isLoading;
                this.elements.btnJoke.disabled = isLoading;
                
                if (type === 'compliment') {
                    this.elements.btnGenerate.textContent = isLoading ? 'Brewing...' : 'Brew Compliment';
                } else if (type === 'joke') {
                    this.elements.btnJoke.textContent = isLoading ? 'Thinking...' : 'Tell a Joke';
                }
                
                if (isLoading) {
                    this.elements.output.classList.add('loading-state');
                } else {
                    this.elements.output.classList.remove('loading-state');
                }
            }

            async handleCopy() {
                const text = this.state.currentCompliment;
                if (!text) {
                    this.showToast("Generate a compliment first! 😅", false);
                    return;
                }
                try {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    textArea.style.position = "fixed"; 
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    const successful = document.execCommand('copy');
                    document.body.removeChild(textArea);
                    
                    if (successful) this.showToast("Copied to clipboard! 📋");
                    else throw new Error('Fallback failed');
                } catch (err) {
                    if(navigator.clipboard) {
                         navigator.clipboard.writeText(text)
                            .then(() => this.showToast("Copied to clipboard! 📋"))
                            .catch(() => this.showToast("Failed to copy 😔", false));
                    }
                }
            }

            async handleShare() {
                const text = this.state.currentCompliment;
                if (!text || !navigator.share) return;
                try {
                    await navigator.share({
                        title: 'Positivity Brew',
                        text: `${text}\n\n- Sent via Positivity Brew ☕`,
                    });
                } catch (error) {}
            }

            showToast(message, isSuccess = true) {
                this.elements.toast.textContent = message;
                this.elements.toast.style.backgroundColor = isSuccess ? 'var(--color-success-state)' : 'var(--color-playful-accent)';
                this.elements.toast.classList.add('show');
                
                if (this.toastTimeout) clearTimeout(this.toastTimeout);
                this.toastTimeout = setTimeout(() => {
                    this.elements.toast.classList.remove('show');
                }, 3000);
            }

            addToHistory(compliment) {
                if (this.state.history.length > 0 && this.state.history[0] === compliment) return; 

                this.state.history.unshift(compliment);
                if (this.state.history.length > this.MAX_HISTORY) this.state.history.pop();

                try { localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.state.history)); } 
                catch (e) {}
                this.renderHistory();
            }

            loadHistory() {
                try {
                    const saved = localStorage.getItem(this.STORAGE_KEY);
                    if (saved) this.state.history = JSON.parse(saved);
                } catch (e) { this.state.history = []; }
            }

            renderHistory() {
                this.elements.historyList.innerHTML = '';
                if (this.state.history.length === 0) {
                    const emptyLi = document.createElement('li');
                    emptyLi.className = 'history-item';
                    emptyLi.style.textAlign = 'center';
                    emptyLi.style.borderLeft = 'none';
                    emptyLi.style.opacity = '0.6';
                    emptyLi.style.background = 'none';
                    emptyLi.style.boxShadow = 'none';
                    emptyLi.textContent = 'No history yet. 🕰️';
                    this.elements.historyList.appendChild(emptyLi);
                    return;
                }

                this.state.history.forEach((text, index) => {
                    const li = document.createElement('li');
                    li.className = 'history-item';
                    li.textContent = text; 
                    li.style.animationDelay = `${index * 80}ms`;
                    this.elements.historyList.appendChild(li);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new ComplimentApp();
        });
    </script>
